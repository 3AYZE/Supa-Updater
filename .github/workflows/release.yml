name: Build and publish release

on:
  push:
    branches: [main]
    paths: ['app.pyw','engine.py','driver_scan.py','windows_updates.py','self_update.py','update_helper.py','storage.py','version.json','assets/**','tests/**','.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare icon assets
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image, ImageDraw
          from pathlib import Path
          Path("assets").mkdir(exist_ok=True)
          s=1024
          im=Image.new("RGBA",(s,s),(0,0,0,0))
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((96,96,928,928),radius=216,fill=(27,105,207,255))
          d.rounded_rectangle((136,136,888,888),radius=184,fill=(47,154,245,255))
          d.arc((232,232,792,792),start=40,end=300,fill="white",width=96)
          d.polygon([(740,208),(880,232),(844,376),(792,312),(712,400),(648,336),(736,252)],fill="white")
          d.arc((168,168,856,856),start=190,end=315,fill=(180,230,255,180),width=20)
          im.save("assets/SupaUpdater.png",optimize=True)
          im.save("assets/SupaUpdater.ico",format="ICO",sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6.10,<7"
          python -m PyInstaller --onefile --windowed --clean --noupx --name SupaUpdater --icon assets/SupaUpdater.ico --add-data "assets/SupaUpdater.ico;assets" --add-data "assets/SupaUpdater.png;assets" app.pyw
      - name: Build detached update helper
        run: python -m PyInstaller --onefile --console --clean --noupx --name SupaUpdaterUpdateHelper update_helper.py
      - name: Package source edition
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $root = Join-Path $env:RUNNER_TEMP 'SupaUpdater'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          @('app.pyw','engine.py','driver_scan.py','windows_updates.py','self_update.py','update_helper.py','storage.py','version.json','README.md') | ForEach-Object { Copy-Item $_ $root }
          Copy-Item 'assets' (Join-Path $root 'assets') -Recurse
          Compress-Archive -Path $root -DestinationPath "SupaUpdater-v$version-source.zip" -Force
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Bump version.json for a new release." }
          gh release create $tag "dist/SupaUpdater.exe" "dist/SupaUpdaterUpdateHelper.exe" "SupaUpdater-v$version-source.zip" --target "$(git rev-parse HEAD)" --title "SupaUpdater $tag" --notes "SupaUpdater v$version: redesigned update workflow, GitHub self-update support, and new Fluent-inspired Windows icon."
