name: Build and publish release

on:
  push:
    branches: [main]
    paths:
      - 'app.pyw'
      - 'engine.py'
      - 'driver_scan.py'
      - 'windows_updates.py'
      - 'self_update.py'
      - 'update_helper.py'
      - 'storage.py'
      - 'version.json'
      - 'tests/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare initial source import
        shell: pwsh
        run: |
          if (Test-Path bootstrap.py) {
            python bootstrap.py
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add -A
            git commit -m 'Import cleaned SupaUpdater v1.3.0 source'
            git push origin HEAD:main
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6.10,<7"
          python -m PyInstaller --onefile --windowed --clean --noupx --name SupaUpdater app.pyw
      - name: Package source edition
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $root = Join-Path $env:RUNNER_TEMP 'SupaUpdater'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          @('app.pyw','engine.py','driver_scan.py','windows_updates.py','self_update.py','update_helper.py','storage.py','version.json','README.md') | ForEach-Object { Copy-Item $_ $root }
          Compress-Archive -Path $root -DestinationPath "SupaUpdater-v$version-source.zip" -Force
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Bump version.json for a new release." }
          gh release create $tag "dist/SupaUpdater.exe" "SupaUpdater-v$version-source.zip" --target "$(git rev-parse HEAD)" --title "SupaUpdater $tag" --notes "Windows software and optional driver updates. Source edition supports confirmed self-updates; portable EXE provides release notifications. Windows tests and build must pass before publication."